<!--
  Wazuh manager configuration for the clinic SIEM.

  The manager receives events from the agents (EMR server, router), runs them
  through Wazuh's rules plus ours (rules/clinic_rules.xml) and writes alerts.
  Everything a small clinic does not use is switched off, to keep memory low
  and the alert stream short.
-->
<ossec_config>
  <global>
    <jsonout_output>yes</jsonout_output>   <!-- logs/alerts/alerts.json -->
    <alerts_log>no</alerts_log>            <!-- the plain-text copy is not needed -->
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <!-- An agent that goes quiet for a minute is reported as disconnected. -->
    <agents_disconnection_time>1m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
    <update_check>no</update_check>        <!-- the SIEM has no internet access -->
  </global>

  <!-- Wazuh levels run 0-15. Level 3 and up is kept in alerts.json (the
       record); level 7 and up goes to the clinic map (see integration below). -->
  <alerts>
    <log_alert_level>3</log_alert_level>
  </alerts>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <!-- Agents send their events here (encrypted, TCP 1514). -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <!-- Agents enroll here (TCP 1515) and must know the password in
       etc/authd.pass, which ./lab up generates for each deployment. In a
       real clinic, use per-agent certificates (ssl_agent_ca) as well. -->
  <auth>
    <disabled>no</disabled>
    <port>1515</port>
    <use_source_ip>no</use_source_ip>
    <purge>yes</purge>
    <use_password>yes</use_password>
    <ssl_verify_host>no</ssl_verify_host>
    <ssl_manager_cert>etc/sslmanager.cert</ssl_manager_cert>
    <ssl_manager_key>etc/sslmanager.key</ssl_manager_key>
  </auth>

  <ruleset>
    <!-- Wazuh's own rules and decoders -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>
    <list>etc/lists/malicious-ioc/malware-hashes</list>
    <list>etc/lists/malicious-ioc/malicious-ip</list>
    <list>etc/lists/malicious-ioc/malicious-domains</list>
    <!-- Ours: etc/rules/clinic_rules.xml -->
    <decoder_dir>etc/decoders</decoder_dir>
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- wazuh-logtest, for trying rules by hand: ./lab shell siem, then
       /var/ossec/bin/wazuh-logtest -->
  <rule_test>
    <enabled>yes</enabled>
    <threads>1</threads>
  </rule_test>

  <!-- Every alert of level 7 or more is handed to our integration, which
       appends one plain-English line to run/alerts.jsonl for the clinic map.
       Why an integration and not our own log follower: wazuh-integratord
       already follows alerts.json (including file rotation and restarts),
       so our script stays a small, testable "alert in, line out" function. -->
  <integration>
    <name>custom-clinic</name>
    <level>7</level>
    <alert_format>json</alert_format>
  </integration>

  <!-- Off: checks of the SIEM machine itself and features that need the
       Wazuh indexer or internet access. -->
  <syscheck><disabled>yes</disabled></syscheck>
  <rootcheck><disabled>yes</disabled></rootcheck>
  <sca><enabled>no</enabled></sca>
  <wodle name="syscollector"><disabled>yes</disabled></wodle>
  <vulnerability-detection><enabled>no</enabled></vulnerability-detection>
  <indexer><enabled>no</enabled></indexer>
</ossec_config>
