# The segmented clinic ("after"). Deploy with: ./lab up
#
#            internet ── home-doctor (VPN tunnel to the router)
#               │ (WAN)
#            router  (nftables firewall, router-on-a-stick)
#               │ (802.1Q trunk)
#            switch  (VLAN-aware bridge)
#   ┌─────┬─────┼──────┬───────┬────────┐
#  staff servers devices printers guest Wi-Fi
#  VLAN10 VLAN20  VLAN30  VLAN40   VLAN50
name: clinic

mgmt:
  network: clinic-mgmt
  ipv4-subnet: 172.31.254.0/24
  ipv6-subnet: 3fff:172:31:254::/64

topology:
  defaults:
    kind: linux
    image: clinic-net-lab/node:${CLINIC_IMAGE_TAG:=dev}
    # No management interface: every packet a machine sends must go through
    # the lab network, so nothing can sneak around the firewall.
    network-mode: none

  nodes:
    router:
      env: { ROLE: router }
      binds:
        - ../config/clinic/router:/etc/clinic/router:ro
        - ../run/logs:/var/log/clinic
        - ../run/wg:/var/lib/clinic/wg-pubkeys   # VPN public keys only (see clinic-wg)
    switch:
      env: { ROLE: switch }
      binds:
        - ../config/clinic/switch:/etc/clinic/switch:ro
    internet:
      env: { ROLE: internet, SERVICES: "web" }

    # VLAN 10 - staff
    reception-pc:
      env: { IP: 10.10.10.11/24, GW: 10.10.10.1, DNS: 10.10.10.1, SERVICES: "listen:445,3389" }
    doctor-pc:
      env: { IP: 10.10.10.12/24, GW: 10.10.10.1, DNS: 10.10.10.1, SERVICES: "listen:445,3389" }

    # VLAN 20 - servers
    emr:
      env: { IP: 10.10.20.10/24, GW: 10.10.20.1, DNS: 10.10.20.1, SERVICES: "emr hl7 listen:22", READY_PORTS: "443 445 2575" }
    pacs:
      # Orthanc, a real DICOM archive (images/pacs).
      image: clinic-net-lab/pacs:${CLINIC_IMAGE_TAG:=dev}
      env: { IP: 10.10.20.20/24, GW: 10.10.20.1, DNS: 10.10.20.1, SERVICES: "orthanc", READY_PORTS: "4242 8042" }

    # VLAN 30 - medical devices (no DNS server on purpose)
    imaging:
      env: { IP: 10.10.30.10/24, GW: 10.10.30.1, SERVICES: "listen:445,3389" }
    lab-analyzer:
      env: { IP: 10.10.30.11/24, GW: 10.10.30.1, SERVICES: "listen:22" }

    # VLAN 40 - printers and fax
    printer:
      env: { IP: 10.10.40.10/24, GW: 10.10.40.1, SERVICES: "listen:631,9100" }

    # VLAN 50 - guest Wi-Fi (addresses from DHCP)
    guest-laptop:
      env: { IP: dhcp, SERVICES: "listen:445" }
    guest-phone:
      env: { IP: dhcp, SERVICES: "listen:8080" }

    # A doctor's laptop at home, on the internet. Reaches the EMR through a
    # WireGuard VPN to the router (tunnel 10.10.60.0/24); see post-up.sh.
    home-doctor:
      env: { IP: 192.0.2.50/24, GW: 192.0.2.1, DNS: 203.0.113.10 }
      binds:
        - ../config/clinic/home-doctor:/etc/clinic/node:ro
        - ../run/wg:/var/lib/clinic/wg-pubkeys

  links:
    - { endpoints: ["router:eth1", "internet:eth1"], mtu: 1500 }
    - { endpoints: ["internet:eth2", "home-doctor:eth1"], mtu: 1500 }
    - { endpoints: ["router:eth2", "switch:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth2", "reception-pc:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth3", "doctor-pc:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth4", "emr:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth5", "pacs:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth6", "imaging:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth7", "lab-analyzer:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth8", "printer:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth9", "guest-laptop:eth1"], mtu: 1500 }
    - { endpoints: ["switch:eth10", "guest-phone:eth1"], mtu: 1500 }
