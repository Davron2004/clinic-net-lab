# The clinic's network policy, written as plain expectations.
#
# This file is the source of truth for the isolation tests and the clinic
# map. It is deliberately separate from the firewall config
# (config/clinic/router/nftables.nft): the tests check the firewall from the
# outside, by really sending packets from each machine, instead of trusting
# that the rules say what we meant.

zones:
  staff:    { label: "Staff PCs",       vlan: 10, subnet: 10.10.10.0/24 }
  servers:  { label: "Servers",         vlan: 20, subnet: 10.10.20.0/24 }
  devices:  { label: "Medical devices", vlan: 30, subnet: 10.10.30.0/24 }
  printers: { label: "Printers & fax",  vlan: 40, subnet: 10.10.40.0/24 }
  guest:    { label: "Guest Wi-Fi",     vlan: 50, subnet: 10.10.50.0/24 }
  security: { label: "Security monitoring", vlan: 90, subnet: 10.10.90.0/24 }
  internet: { label: "Internet" }
  remote:   { label: "Remote access" }

# ip: the address in the segmented clinic and in the flat "before" network.
# "dhcp" means the address is read from the running machine.
nodes:
  router:       { zone: core,     label: "Router / firewall", ip: { clinic: 10.10.10.1,   flat: 10.10.0.1 } }
  reception-pc: { zone: staff,    label: "Reception PC",      ip: { clinic: 10.10.10.11,  flat: 10.10.0.11 } }
  doctor-pc:    { zone: staff,    label: "Doctor's PC",       ip: { clinic: 10.10.10.12,  flat: 10.10.0.12 } }
  emr:          { zone: servers,  label: "EMR server",        ip: { clinic: 10.10.20.10,  flat: 10.10.0.10 } }
  pacs:         { zone: servers,  label: "Image archive (PACS)", ip: { clinic: 10.10.20.20, flat: 10.10.0.20 } }
  imaging:      { zone: devices,  label: "Imaging workstation", ip: { clinic: 10.10.30.10, flat: 10.10.0.30 } }
  lab-analyzer: { zone: devices,  label: "Lab analyzer",      ip: { clinic: 10.10.30.11,  flat: 10.10.0.31 } }
  printer:      { zone: printers, label: "Printer / fax",     ip: { clinic: 10.10.40.10,  flat: 10.10.0.40 } }
  guest-laptop: { zone: guest,    label: "Guest laptop",      ip: { clinic: dhcp,         flat: dhcp } }
  guest-phone:  { zone: guest,    label: "Guest phone",       ip: { clinic: dhcp,         flat: dhcp } }
  siem:         { zone: security, label: "Security monitor (SIEM)", ip: { clinic: 10.10.90.10, flat: 10.10.0.90 } }
  internet:     { zone: internet, label: "Public website",    ip: { clinic: 203.0.113.10, flat: 203.0.113.10 } }
  # tunnel_ip: the laptop's address inside the VPN (segmented clinic only),
  # which is the source address the firewall sees for its tunnel traffic.
  home-doctor:  { zone: remote,   label: "Doctor at home",    ip: { clinic: 192.0.2.50,   flat: 192.0.2.50 }, tunnel_ip: 10.10.60.2 }
  # The clinic's public address, as seen from the internet.
  clinic-wan:   { zone: core,     label: "Clinic public IP",  ip: { clinic: 198.51.100.2, flat: 198.51.100.2 }, container: router }

# Every flow: from a machine, to a machine, on a service, and whether policy
# allows it. probe is how the test checks it (default tcp). "gateway" means
# the router address on the source machine's own network.
#
# Probe kinds (images/node/rootfs/usr/local/bin/clinic-probe*):
#   tcp           a TCP connection opens (refused counts as blocked)
#   reach         the target answers at all, even if only to refuse the
#                 connection: tests the network path, not the service
#   https         an HTTPS page loads
#   dns           the DNS server answers a lookup
#   dicom         DICOM C-ECHO: a real DICOM archive accepts us and answers
#   hl7           an HL7 lab result over MLLP is acknowledged (MSA|AA)
#   pacs-web      the image archive's web viewer / API answers (login prompt)
#   https-direct  HTTPS out of the machine's own cable, never through a VPN
#   https-vpn     HTTPS forced into the machine's VPN tunnel
#   whoami        HTTPS to the public website, which reports the address it saw
#   spoofed-syn   TCP SYNs that claim another machine's address (spoof_as);
#                 the target watches for them, since replies go elsewhere
#
# For every blocked flow the suite also asks the target itself whether the
# service is running; if it is not, the block proves nothing and the flow is
# an ERROR. no_service: true marks the rare flow where nothing runs behind
# the port by design (use sparingly, with a comment saying why).
flows:
  # ---- allowed: each one is a job someone needs done ----
  - { id: A01, from: reception-pc, to: emr,      port: 443,  probe: https, expect: allow, what: "Front desk opens patient charts in the EMR" }
  - { id: A02, from: doctor-pc,    to: emr,      port: 443,  probe: https, expect: allow, what: "Doctor opens patient charts in the EMR" }
  - { id: A03, from: doctor-pc,    to: pacs,     port: 8042, probe: pacs-web, expect: allow, what: "Doctor views X-rays in the image archive" }
  - { id: A04, from: reception-pc, to: printer,  port: 9100,               expect: allow, what: "Front desk prints a requisition" }
  - { id: A05, from: imaging,      to: pacs,     port: 4242, probe: dicom, expect: allow, what: "Imaging workstation sends new images to the archive (DICOM)" }
  - { id: A06, from: lab-analyzer, to: emr,      port: 2575, probe: hl7,   expect: allow, what: "Lab analyzer sends results to the EMR (HL7)" }
  - { id: A07, from: reception-pc, to: internet, port: 443,  probe: https, expect: allow, what: "Staff browse the web" }
  - { id: A08, from: guest-laptop, to: internet, port: 443,  probe: https, expect: allow, what: "Guests browse the web" }
  - { id: A09, from: guest-laptop, to: gateway,  port: 53,   probe: dns,   expect: allow, what: "Guests look up web addresses (DNS)" }
  - { id: A10, from: doctor-pc,    to: gateway,  port: 53,   probe: dns,   expect: allow, what: "Staff look up web addresses (DNS)" }
  # The website reports the address it sees (probe whoami); seen_as says
  # which it must be. Without address translation (NAT) it would see the
  # PC's private address, and replies could not find their way back on the
  # real internet.
  - { id: A11, from: reception-pc, to: internet, port: 443,  probe: whoami, seen_as: clinic-wan, expect: allow, what: "Staff web traffic leaves from the clinic's one public address (NAT)" }

  # ---- forbidden: guest Wi-Fi is the outside world ----
  - { id: D01, from: guest-laptop, to: emr,          port: 443,  probe: https, expect: deny, what: "Guest reaches the EMR web app" }
  - { id: D02, from: guest-laptop, to: emr,          port: 445,                expect: deny, what: "Guest reaches the patient records file share" }
  - { id: D03, from: guest-laptop, to: pacs,         port: 8042, probe: pacs-web, expect: deny, what: "Guest reaches the image archive" }
  - { id: D04, from: guest-laptop, to: reception-pc, port: 3389,               expect: deny, what: "Guest remote-desktops into the reception PC" }
  - { id: D05, from: guest-laptop, to: printer,      port: 9100,               expect: deny, what: "Guest prints to (or attacks) the clinic printer" }
  - { id: D06, from: guest-laptop, to: guest-phone,  port: 8080,               expect: deny, what: "One guest device reaches another (client isolation)" }

  # ---- forbidden: medical devices do one job only ----
  - { id: D07, from: imaging,      to: internet,     port: 443,  probe: https, expect: deny, what: "Imaging workstation reaches the internet" }
  - { id: D08, from: imaging,      to: emr,          port: 445,                expect: deny, what: "Imaging workstation reaches the patient records share" }
  - { id: D09, from: imaging,      to: reception-pc, port: 445,                expect: deny, what: "Imaging workstation spreads to a staff PC (SMB)" }
  - { id: D10, from: imaging,      to: doctor-pc,    port: 3389,               expect: deny, what: "Imaging workstation remote-desktops into a staff PC" }
  - { id: D11, from: imaging,      to: pacs,         port: 8042, probe: pacs-web, expect: deny, what: "Imaging workstation reaches the archive's admin API (could delete studies)" }
  - { id: D12, from: imaging,      to: gateway,      port: 53,   probe: dns,   expect: deny, what: "Imaging workstation uses DNS (a covert way out)" }
  - { id: D13, from: lab-analyzer, to: internet,     port: 443,  probe: https, expect: deny, what: "Lab analyzer reaches the internet" }
  - { id: D23, from: imaging,      to: lab-analyzer, port: 22,                 expect: deny, what: "One medical device reaches another (port isolation)" }

  # ---- forbidden: printers, servers, staff least privilege ----
  - { id: D14, from: printer,      to: internet,     port: 443,  probe: https, expect: deny, what: "Printer phones home to the internet" }
  - { id: D15, from: printer,      to: reception-pc, port: 445,                expect: deny, what: "Printer reaches a staff PC" }
  - { id: D16, from: emr,          to: internet,     port: 443,  probe: https, expect: deny, what: "EMR server uploads to the internet (exfiltration)" }
  - { id: D17, from: reception-pc, to: emr,          port: 445,                expect: deny, what: "Staff PC touches raw record files, bypassing the EMR app" }
  - { id: D18, from: doctor-pc,    to: emr,          port: 22,                 expect: deny, what: "Staff PC opens an admin shell on the EMR server" }
  - { id: D19, from: reception-pc, to: imaging,      port: 445,                expect: deny, what: "Staff PC reaches a medical device" }

  # ---- forbidden: the internet ----
  # Nothing listens on the clinic's public address, so a plain TCP probe
  # would be "blocked" even with no firewall at all. probe: reach counts a
  # refusal as reached, so these fail the moment the firewall stops dropping.
  - { id: D20, from: internet,     to: clinic-wan,   port: 443,  probe: reach, expect: deny, what: "Internet opens a connection to the clinic" }
  - { id: D21, from: internet,     to: emr,          port: 443,  probe: https, expect: deny, what: "Internet reaches the EMR directly" }
  # D22 forces the probe out of the laptop's own cable (https-direct), around
  # the tunnel. Plain https would now go through the VPN and succeed (that is
  # R01). This way the same laptop, the one machine that does hold VPN keys,
  # proves the EMR is not exposed to its home address: without the tunnel
  # there is no way in, not even for a trusted doctor.
  - { id: D22, from: home-doctor,  to: emr,          port: 443,  probe: https-direct, expect: deny, what: "Home laptop reaches the EMR without the VPN" }

  # ---- forbidden: each medical protocol only between the machines that need it ----
  - { id: D24, from: doctor-pc,    to: pacs,         port: 4242, probe: dicom, expect: deny, what: "Staff PC talks DICOM to the archive (only the imaging workstation sends images)" }
  - { id: D25, from: imaging,      to: emr,          port: 2575, probe: hl7,   expect: deny, what: "Imaging workstation files lab results in the EMR (only the lab analyzer may)" }
  - { id: D26, from: lab-analyzer, to: pacs,         port: 4242, probe: dicom, expect: deny, what: "Lab analyzer talks DICOM to the image archive (not its job)" }
  - { id: D27, from: guest-laptop, to: emr,          port: 2575, probe: hl7,   expect: deny, what: "Guest injects fake lab results into the EMR (HL7)" }
  - { id: D28, from: guest-laptop, to: pacs,         port: 4242, probe: dicom, expect: deny, what: "Guest pulls images from the archive (DICOM)" }

  # ---- forbidden: inside a zone ----
  # Machines in the same zone share a subnet, so their traffic never passes
  # the firewall. The switch stops it instead: staff PC and server ports are
  # "isolated" (config/clinic/switch/ports.conf), like the device and guest ports.
  - { id: D29, from: reception-pc, to: doctor-pc,    port: 445,                expect: deny, what: "Infected staff PC spreads to another staff PC (SMB)" }
  - { id: D30, from: reception-pc, to: doctor-pc,    port: 3389,               expect: deny, what: "Staff PC remote-desktops into another staff PC" }
  - { id: D31, from: pacs,         to: emr,          port: 445,                expect: deny, what: "Compromised image archive reaches the patient records share" }
  - { id: D32, from: pacs,         to: emr,          port: 22,                 expect: deny, what: "Compromised image archive opens an admin shell on the EMR server" }
  - { id: D33, from: emr,          to: pacs,         port: 8042, probe: pacs-web, expect: deny, what: "Compromised EMR server reaches the archive's admin API" }

  # ---- forbidden: borrowing another machine's address ----
  # The router checks each packet's source address against where it came
  # from (nftables.nft, chain prerouting). Without that check, a guest could
  # send packets as the EMR server and the guest-web rule would let them out.
  - { id: D35, from: guest-laptop, to: internet,     port: 443,  probe: spoofed-syn, spoof_as: emr, expect: deny, what: "Guest sends packets pretending to be the EMR server" }

  # ---- forbidden: servers have no use for DNS ----
  - { id: D34, from: emr,          to: gateway,      port: 53,   probe: dns,   expect: deny, what: "EMR server uses DNS (a covert way out)" }

  # ---- remote access: a doctor working from home ----
  # Segmented clinic: a WireGuard VPN that leads to the EMR web app and
  # nothing else. Flat clinic: no VPN; remote access is a port forward to the
  # reception PC's remote desktop, so R01 shows as broken there and R07 as a
  # violation. That is the honest picture of the "before" network.
  - { id: R01, from: home-doctor,  to: emr,          port: 443,  probe: https, expect: allow, what: "Doctor at home opens the EMR over the VPN" }
  - { id: R02, from: home-doctor,  to: pacs,         port: 8042, probe: pacs-web, expect: deny, what: "VPN user reaches the image archive" }
  - { id: R03, from: home-doctor,  to: emr,          port: 445,                expect: deny, what: "VPN user reaches the patient records file share" }
  - { id: R04, from: home-doctor,  to: emr,          port: 22,                 expect: deny, what: "VPN user opens an admin shell on the EMR server" }
  - { id: R05, from: home-doctor,  to: doctor-pc,    port: 3389,               expect: deny, what: "VPN user remote-desktops into a staff PC" }
  - { id: R06, from: home-doctor,  to: internet,     port: 443,  probe: https-vpn, expect: deny, what: "Laptop uses the clinic as its route to the internet (through the VPN)" }
  - { id: R07, from: internet,     to: clinic-wan,   port: 3389, probe: reach, expect: deny, what: "Anyone on the internet reaches a staff PC's remote desktop (port forward)" }

  # ---- security monitoring (the SIEM) ----
  # probe "reach" tests the network path: a refused connection counts as
  # reached, so these pass even while Wazuh is still starting or switched off.
  - { id: S01, from: emr,          to: siem,     port: 1514, probe: reach, expect: allow, what: "EMR server's security agent sends events to the SIEM" }
  - { id: S02, from: emr,          to: siem,     port: 1515, probe: reach, expect: allow, what: "EMR server's security agent enrolls with the SIEM" }
  - { id: S03, from: router,       to: siem,     port: 1514, probe: reach, expect: allow, what: "Router's security agent ships the firewall log to the SIEM" }
  - { id: S04, from: reception-pc, to: siem,     port: 1515, probe: reach, expect: deny,  what: "Staff PC enrolls a fake agent with the SIEM" }
  - { id: S05, from: guest-laptop, to: siem,     port: 1514, probe: reach, expect: deny,  what: "Guest reaches the SIEM" }
  - { id: S06, from: imaging,      to: siem,     port: 1514, probe: reach, expect: deny,  what: "Infected medical device floods or tampers with the SIEM" }
  - { id: S07, from: pacs,         to: siem,     port: 1515, probe: reach, expect: deny,  what: "A server without an agent talks to the SIEM" }
  - { id: S08, from: siem,         to: internet, port: 443,  probe: https, expect: deny,  what: "SIEM sends the clinic's security logs to the internet" }

# What the flat "before" network gets wrong, flow by flow. CI runs
# ./lab test --expect-violations on the flat network, which passes only if
# the suite finds exactly these (no more, no fewer, and no errors). A flow
# that silently stops being caught there means the test lost its teeth.
flat_known:
  # Forbidden flows that get through: on one flat subnet every machine
  # reaches every other, and the router lets everything out to the internet.
  # Only the internet side is closed (D20, D21, D22 and the VPN-only R02-R06
  # hold), except the remote desktop port forward (R07).
  violations: [D01, D02, D03, D04, D05, D06, D07, D08, D09, D10, D11, D12, D13, D14, D15,
               D16, D17, D18, D19, D23, D24, D25, D26, D27, D28, D29, D30, D31, D32, D33,
               D34, D35, R07, S04, S05, S06, S07, S08]
  # Needed flows that do not work: there is no VPN, so the doctor at home
  # cannot open the EMR (they use the remote desktop port forward instead).
  broken: [R01]

# The default-deny sweep (tests/isolation.py): from each source it tries
# every port below on one target in every other zone, and on the router.
# Anything that gets through must be an allowed flow above, or listed in
# also_allowed (things the firewall allows a whole zone, beyond the one
# machine a flow above happens to name).
sweep:
  sources: [reception-pc, emr, imaging, printer, guest-laptop, siem, internet, home-doctor]
  targets: [reception-pc, emr, imaging, printer, guest-phone, siem, internet]
  tcp: [22, 23, 25, 53, 80, 135, 139, 443, 445, 631, 1514, 1515, 2575, 3306, 3389, 4242, 5900, 8042, 8080, 9100]
  udp: [53, 123, 161, 5353]
  also_allowed:
    - { from: reception-pc, to: printer,  proto: tcp, port: 631 }   # printing over IPP (staff-print)
    - { from: reception-pc, to: internet, proto: tcp, port: 80 }    # plain-HTTP web (staff-web)
    - { from: reception-pc, to: gateway,  proto: udp, port: 53 }    # DNS (A10 is the doctor's PC)
    - { from: reception-pc, to: gateway,  proto: tcp, port: 53 }    # DNS over TCP, for large answers
    - { from: guest-laptop, to: internet, proto: tcp, port: 80 }    # plain-HTTP web (guest-web)
    - { from: guest-laptop, to: gateway,  proto: tcp, port: 53 }    # DNS over TCP
