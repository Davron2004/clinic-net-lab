# DNS for the clinic, DHCP for guest Wi-Fi.
# The router answers clinic names itself and forwards everything else to the
# public resolver. It listens on every inside network; which zones may
# actually ask is decided by the firewall (nftables.nft, chain input), so the
# isolation tests check the firewall rather than a quirk of this file.
no-resolv
no-hosts
server=203.0.113.10
bind-dynamic
except-interface=eth1
log-facility=/var/log/clinic/dnsmasq.log

domain=clinic.internal
address=/emr.clinic.internal/10.10.20.10
address=/pacs.clinic.internal/10.10.20.20
address=/printer.clinic.internal/10.10.40.10

# Guest Wi-Fi: short leases from a pool. Gateway and DNS are the router.
dhcp-range=eth2.50,10.10.50.100,10.10.50.199,255.255.255.0,1h
dhcp-option=eth2.50,option:router,10.10.50.1
dhcp-option=eth2.50,option:dns-server,10.10.50.1
