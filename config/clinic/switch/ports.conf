# Core switch port map (segmented clinic).
# port  mode    vlan(s)              connected to
eth1    trunk   10,20,30,40,50,90    # router (all VLANs, tagged)
eth2    access  10                   # reception-pc
eth3    access  10                   # doctor-pc
eth4    access  20                   # emr
eth5    access  20                   # pacs
eth6    access  30   isolated        # imaging       (devices never talk to each other)
eth7    access  30   isolated        # lab-analyzer
eth8    access  40                   # printer
eth9    access  50   isolated        # guest-laptop  (Wi-Fi access point port)
eth10   access  50   isolated        # guest-phone
eth11   access  90                   # siem          (security monitor)
